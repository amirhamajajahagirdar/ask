<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dipression</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="card-container">
        <!-- screen 1 -->
      <div class="img">
        <img src="github_profile_under_1mb.jpg" alt="me"/>
      </div>
      <h1>Will you date me?</h1>
      <div class="scontainer">
        <button id="yesbtn">Yes</button>
        <button id="nobtn">No</button>
      </div>
      <div class="hidden"><!-- screen 2 -->
        <h1>wait you actually said yes!</h1>
        <button id="okbtn">ok</button>
      </div>
      <!-- screen 3 -->
       <div class="date">
        <h1>so when are we going on a date?</h1>
        <div class="dateinput">
          <input type="date" id="dateInput" />
          <input type="time" id="timeInput" />
          <button id="fix">Fix Meeting</button>
        </div>
       </div>
       <!-- screen 4 -->
       <div class="hidden">
        <h1>What do you want to Eat?</h1>
        <div class="food">
          <button id="pizza">Pizza</button>
          <button id="burger">Burger</button>
          <button id="pasta">Pasta</button>
          <button id="sushi">Sushi</button>
       </div>
    </div>
    <!-- screen 5 -->
    <div class="hidden">
      <h1>Glad you Did'nt say NO</h1>
      <p>Ok then i'll see you then!</p>
    </div>
    <script src="script.js"></script>
  </body>
</html>
